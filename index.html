<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE CODING POETRY</title>

  <!-- Schriften: Sometype Mono (Überschrift/UI), Noto Sans Kawi (Ausgabe) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kawi:wght@400;700&family=Sometype+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <div class="page">

    <!-- ===== Kopfbereich: nur noch die zentrierte Überschrift ===== -->
    <header class="site-header">
      <h1 class="site-title">LIVE CODING POETRY</h1>
    </header>

    <!-- ===== Hauptbereich: zwei Fenster nebeneinander ===== -->
    <main class="layout">

      <!-- LINKS: Eingabe -->
      <section class="window" aria-label="Eingabe">
        <div class="window-body">
          <label for="code-input" class="visually-hidden">LIVE-CODING-EINGABE</label>
          <textarea id="code-input" class="code-input" spellcheck="false" autocomplete="off"
                    autocapitalize="off" autocorrect="off"
                    placeholder="&lt;SHUFFLE-WORDS&gt;&lt;EQUALITY-OPERATOR: &quot;==&quot;&gt;&lt;SHUFFLE-WORDS&gt;"></textarea>

          <div class="toolbar">
            <button type="button" id="clear-btn" class="btn">EINGABE LEEREN</button>
          </div>

          <!-- Cheat Sheet als Button-Grid unter dem Code-Input -->
          <fieldset class="groupbox">
            <legend>BAUSTEINE – KLICKEN ZUM EINFÜGEN</legend>
            <div id="cheat-buttons" class="cheat-buttons"></div>
          </fieldset>

          <!-- Eigene Wörter -->
          <fieldset class="groupbox">
            <legend>EIGENE WÖRTER</legend>

            <form id="word-form" class="word-form" autocomplete="off">
              <input type="text" id="word-input" class="text-input" maxlength="60"
                     placeholder="NEUES WORT …" aria-label="Neues Wort">
              <button type="submit" class="btn">WORT HINZUFÜGEN</button>
            </form>

            <p id="word-feedback" class="feedback" aria-live="polite"></p>

            <ul id="chip-list" class="chip-list" aria-label="Bisher hinzugefügte Wörter"></ul>

            <button type="button" id="reset-words-btn" class="btn btn-small">EIGENE WÖRTER ZURÜCKSETZEN</button>
          </fieldset>
        </div>
      </section>

      <!-- RECHTS: Ausgabe -->
      <section class="window" aria-label="Gedicht">
        <div class="window-body">
          <div id="output" class="output" aria-label="Gerenderte Ausgabe"></div>

          <div class="toolbar">
            <button type="button" id="copy-btn" class="btn">AUSGABE KOPIEREN</button>
          </div>
        </div>
      </section>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="site-footer">
      <p>
        <a href="https://jakob-buurman.de/impressum">IMPRESSUM</a>
        &nbsp;·&nbsp;
        ERSTELLT UNTER BENUTZUNG VON KI
        &nbsp;·&nbsp;
        WORTDATENBANK: <a href="https://github.com/gambolputty/german-nouns">GERMAN-NOUNS</a> (CC-BY-SA 4.0),
        <a href="https://github.com/PenTestical/german_names">GERMAN_NAMES</a>
      </p>
    </footer>

    <!-- ===== Statusleiste: Ladeanzeige + Hinweise ===== -->
    <div class="statusbar">
      <div id="status-text" class="status-field" role="status">LADE WORTLISTE …</div>
      <div id="loader" class="loader" role="progressbar" aria-label="Wortliste wird geladen"></div>
    </div>

  </div>
</body>
</html>
