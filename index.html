<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE CODING POETRY</title>

  <!-- Schrift: Sometype Mono (gilt für die gesamte Seite inklusive Ausgabe) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sometype+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>	
	 <!--
    Seitenaufbau (von oben nach unten). Auf einem PC-Bildschirm füllt die
    Seite genau die Fensterhöhe aus – gescrollt wird nur INNERHALB von
    Eingabe und Ausgabe (und nur vertikal), nie die ganze Seite.
      1. Überschrift
      2. Eingabe- und Ausgabefenster (nebeneinander, feste Spaltenbreiten)
      3. Statusleiste (schließt direkt an die Fenster an)
      4. Footer (unterstes Element der Seite)
  -->
  <div class="page">

    <!-- ===== 1. Kopfbereich ===== -->
    <header class="site-header">
      <h1 class="site-title"><a href="https://jakob-buurman.de/live-coding-poetry/">LIVE CODING POETRY</a></h1>
    </header>

    <!-- ===== 2. Fenster ===== -->
    <main class="layout">

      <!-- LINKS: Eingabe -->
      <section class="window" aria-label="Eingabe">
        <div class="window-body">
          <label for="code-input" class="visually-hidden">Live-Coding-Eingabe</label>

          <!--
            Lange Zeilen werden umbrochen (kein horizontaler Scroller);
            bei viel Text erscheint der vertikale Scroller.
          -->
          <textarea id="code-input" class="code-input scroller"
                    spellcheck="false" autocomplete="off"
                    autocapitalize="off" autocorrect="off"
                    placeholder="&lt;shuffle-word&gt; &lt;equality-operator: &quot;==&quot;&gt; &lt;shuffle-word&gt;"></textarea>

          <div class="toolbar">
            <button type="button" id="clear-btn" class="btn">EINGABE LEEREN</button>
          </div>

          <!-- Bausteine: werden per JavaScript erzeugt -->
          <fieldset class="groupbox">
            <legend>BAUSTEINE – KLICKEN ZUM EINFÜGEN</legend>
            <div id="cheat-buttons" class="cheat-buttons"></div>
          </fieldset>

          <!-- Eigene Wörter: Formular und Zurücksetzen in einer Zeile (spart Höhe) -->
          <fieldset class="groupbox">
            <legend>EIGENE WÖRTER</legend>

            <form id="word-form" class="word-form" autocomplete="off">
              <input type="text" id="word-input" class="text-input" maxlength="60"
                     placeholder="NEUES WORT …" aria-label="Neues Wort">
              <button type="submit" class="btn btn-small">WORT HINZUFÜGEN</button>
              <button type="button" id="reset-words-btn" class="btn btn-small">EIGENE WÖRTER ZURÜCKSETZEN</button>
            </form>

            <p id="word-feedback" class="feedback" aria-live="polite"></p>

            <ul id="chip-list" class="chip-list scroller" aria-label="Bisher hinzugefügte Wörter"></ul>
          </fieldset>
        </div>
      </section>

      <!-- RECHTS: Ausgabe (scrollt nur vertikal) -->
      <section class="window" aria-label="Gedicht">
        <div class="window-body">
          <div id="output" class="output scroller" aria-label="Gerenderte Ausgabe"></div>

          <div class="toolbar">
            <button type="button" id="copy-btn" class="btn">AUSGABE KOPIEREN</button>
          </div>
        </div>
      </section>
    </main>
	  

    <!-- ===== 3. Statusleiste: direkt unter den Fenstern ===== -->
    <div class="statusbar">
      <div id="status-text" class="status-field" role="status">LADE WORTLISTE …</div>
      <div id="loader" class="loader" role="progressbar" aria-label="Wortliste wird geladen"></div>
    </div>

    <!-- ===== 4. Footer: unterstes Element der Seite ===== -->
     <footer class="site-footer">
      <p>
        KONZEPT VON <a href="https://jakob-buurman.de/">JAKOB BUURMAN</a>
        · CODING-UMSETZUNG UNTER VERWENDUNG VON KI
      </p>
      <p>
        WORTDATENBANK:
        <a href="https://github.com/gambolputty/german-nouns">GERMAN-NOUNS</a> (CC-BY-SA 4.0)
      </p>
      <p><a href="https://jakob-buurman.de/">ZURUECK NACH HAUSE</a></p>
      <p><a href="https://jakob-buurman.de/impressum">IMPRESSUM</a></p>
    </footer>

  </div>
</body>
</html>
